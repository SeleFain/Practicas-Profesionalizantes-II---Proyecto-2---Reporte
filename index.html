<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reporte Inventario</title>
        <link rel="stylesheet" herf="styles.css">
    </head>
    <body>
        <div class="contenedor">
            <h1>Inventario Tienda Informática</h1>
            <!--Definiendo los filtros-->
            <div class="filtros">
                <select id="filtro">
                    <option value="modelo">Modelo</option>
                    <option value="precio_unitario">Precio Unitario</option>
                <option value="stock">Stock</option>
                </select>
                <!--Definiendo el orden en que se van a mostrar los insumos informáticos(ascendente o descendente)-->
                <select id="orden">
                    <option value="asc">Ascendente</option>
                    <option value="desc">Descendente</option>
                </select>
                <button onclick="filtrar()">Ordenar</button>
            </div>
            <br>
            <!--Definiendo la tabla del inventario-->
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio Unitario</th>
                        <th>Cantidad Disponible</th>
                    </tr>
                </thead>
                <!--Esta parte corresponde a la muestra de los datos en cada columna. Queda a resolver entre JavaScript y la parte de backend con Python, en especial la conexión con la base de datos-->
                <tbody>
                    <tr>
                        <td>{{ producto.nombre }}</td>
                        <td>${{ producto.precio }}</td>
                        <td>{{ producto.cantidad }}</td>
                    </tr>
                </tbody>
            </table>
            
        </div>
        
        <script src="codigo.js"></script>
    </body>
</html>
